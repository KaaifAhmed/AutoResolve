<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoResolve - AI Agent</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Load a clean sans-serif font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="chat-page">
        <header>
            <h1>AutoResolve</h1>
            <p class="text-muted">Chat Interface &bull; Session: <span id="session-id-display">user_123</span></p>
        </header>

        <main class="chat-window">
            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">Hello! I'm AutoResolve. How can I help you today?</div>
            </div>
            
            <form class="chat-input-area" id="chat-form">
                <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" required>
                <button type="submit" id="send-button">Send</button>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
